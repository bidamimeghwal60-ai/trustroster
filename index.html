<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustRoster - B2B Compliance & Security Directory</title>
    <meta name="description" content="Find verified, compliance-ready B2B vendors. Search 500+ cloud, developer, and business tools verified for HIPAA, SOC 2 Type II, ISO 27001, and GDPR with audit details and minimum plan requirements." />
    <meta property="og:title" content="TrustRoster - B2B Compliance & Security Directory" />
    <meta property="og:description" content="Search 500+ cloud, developer, and business tools verified for HIPAA, SOC 2 Type II, ISO 27001, and GDPR." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://trustroster.dev/#website",
          "name": "TrustRoster",
          "url": "https://trustroster.dev",
          "description": "Find verified, compliance-ready B2B vendors verified for HIPAA, SOC 2 Type II, ISO 27001, and GDPR.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://trustroster.dev/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://trustroster.dev/#software",
          "name": "TrustRoster Compliance Directory",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "All",
          "description": "Interactive registry of cloud software, databases, authentication, and communication vendors with verified audit reports, HIPAA BAA eligibility tiers, and security packs.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
